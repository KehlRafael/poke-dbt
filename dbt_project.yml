name: 'pokedex'
version: '1.0.0'
config-version: 2

profile: 'pokedex'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  pokedex:
    staging:
      +materialized: table
      +schema: stg
    intermediate:
      +materialized: view
    marts:
      +materialized: table

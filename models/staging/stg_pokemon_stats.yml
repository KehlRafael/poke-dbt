version: 2

models:
  - name: stg_pokemon_stats
    description: Long-format base stats, one row per (pokemon_id, stat_id). Pivoted downstream in intermediate.
    columns:
      - name: pokemon_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_pokemon')
              field: pokemon_id
      - name: stat_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_stats')
              field: stat_id
      - name: base_stat
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - pokemon_id
            - stat_id

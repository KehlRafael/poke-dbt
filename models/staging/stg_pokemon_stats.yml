version: 2

models:
  - name: stg_pokemon_stats
    description: Long-format base stats, one row per (pokemon_id, stat_id). Pivoted downstream in intermediate.
    columns:
      - name: pokemon_id
        description: Foreign key to stg_pokemon.pokemon_id.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_pokemon')
                field: pokemon_id
      - name: stat_id
        description: Foreign key to stg_stats.stat_id.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_stats')
                field: stat_id
      - name: base_stat
        description: Base value for this stat.
        data_tests:
          - not_null
      - name: effort_value
        description: Effort Value (EV) yield awarded for defeating this Pokémon.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - pokemon_id
              - stat_id

version: 2

models:
  - name: stg_pokemon
    description: One row per Pokémon form/variant (the leaf entity everything else attaches to).
    columns:
      - name: pokemon_id
        data_tests:
          - unique
          - not_null
      - name: species_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_pokemon_species')
              field: species_id

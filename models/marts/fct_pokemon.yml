version: 2

models:
  - name: fct_pokemon
    description: >
      One row per Pokémon form, denormalized with species metadata, primary/secondary
      type, abilities, wide base stats, and a derived stat_total / stat_tier.
    columns:
      - name: pokemon_id
        data_tests:
          - unique
          - not_null
      - name: forms_list
        description: Comma-separated list of form/variant names for this Pokémon.
      - name: stat_total
        description: Sum of the six base stats.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 100
              max_value: 800
              config:
                severity: warn
      - name: stat_tier
        data_tests:
          - accepted_values:
              values:
                - 'S - Top tier'
                - 'A - Strong'
                - 'B - Balanced'
                - 'C - Below average'
                - 'D - Weak'
      - name: primary_type
        data_tests:
          - not_null
